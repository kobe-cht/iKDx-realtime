name: Fetch US Stock Realtime Data

# 觸發來源：cloudflare-cron-worker 在美股盤中時段呼叫 workflow_dispatch
# 美股盤中（紐約時間 09:30–16:00）每 10 分鐘由 worker 端觸發
# workflow 內部仍做一層盤中時段防呆，避免手動誤觸發在收盤後寫入髒資料
# 收盤後 17:00–18:00（紐約時間）另有補抓，僅更新指數（S&P 500、SOX）的最終收盤價
on:
    workflow_dispatch:
        inputs:
            force:
                description: '強制執行（忽略盤中時段檢查）'
                required: false
                type: boolean
                default: false

jobs:
    fetch-us-realtime:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Check if US market is open
              id: market-check
              run: |
                  # 取得紐約時間（自動處理夏冬令時間）
                  NY_TIME=$(TZ=America/New_York date +"%H%M")
                  NY_DAY=$(TZ=America/New_York date +"%u")  # 1=Monday, 7=Sunday

                  echo "Current NY time: $NY_TIME"
                  echo "Current NY day: $NY_DAY"

                  # 預設皆不執行，下面依時段覆寫
                  echo "should_run=false" >> $GITHUB_OUTPUT
                  echo "post_close=false" >> $GITHUB_OUTPUT

                  if [ "$NY_DAY" -gt 5 ]; then
                    echo "Weekend - US market is closed"
                    exit 0
                  fi

                  # 09:30 ~ 16:10 紐約時間（含收盤後 16:03 那次，抓最終收盤價）
                  if [ "$NY_TIME" -ge 0930 ] && [ "$NY_TIME" -le 1610 ]; then
                    echo "US market is open"
                    echo "should_run=true" >> $GITHUB_OUTPUT
                  # 17:00 ~ 18:00 紐約時間：只補抓指數最終收盤價。
                  # Yahoo 指數報價收盤後要等到約 16:50~17:15 才會更新成定案值，
                  # 16:04 那次抓到的仍是 15:48 之前的舊值（S&P 500）或更舊的值（SOX）
                  elif [ "$NY_TIME" -ge 1700 ] && [ "$NY_TIME" -le 1800 ]; then
                    echo "US post-close index finalize window"
                    echo "post_close=true" >> $GITHUB_OUTPUT
                  else
                    echo "US market is closed"
                  fi

            - name: Fetch US realtime stock data
              if: steps.market-check.outputs.should_run == 'true' || inputs.force == true
              env:
                  FINNHUB_TOKEN: ${{ secrets.FINNHUB_TOKEN }}
              run: node scripts/fetch-us-realtime.js

            # 指數與 CNN 各自獨立，失敗不阻擋個股資料的 commit（錯誤仍會顯示在該步驟）
            - name: Fetch US index realtime (S&P 500, SOX)
              if: steps.market-check.outputs.should_run == 'true' || steps.market-check.outputs.post_close == 'true' || inputs.force == true
              continue-on-error: true
              run: node scripts/fetch-us-index-realtime.js

            - name: Fetch CNN Fear & Greed realtime
              if: steps.market-check.outputs.should_run == 'true' || inputs.force == true
              continue-on-error: true
              run: node scripts/fetch-cnn-realtime.js

            - name: Commit and push changes
              if: steps.market-check.outputs.should_run == 'true' || steps.market-check.outputs.post_close == 'true' || inputs.force == true
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  if [ -n "$(git status --porcelain)" ]; then
                    git add public/data/
                    NY_TIME=$(TZ=America/New_York date +"%Y-%m-%d %H:%M:%S")
                    git commit -m "📈 Update US realtime stock data - $NY_TIME (NY)"
                    # 推之前 rebase 避免併發衝突
                    for i in 1 2 3 4 5; do
                      git pull --rebase -X theirs origin main || true
                      if git push; then
                        echo "Push succeeded on attempt $i"
                        break
                      fi
                      echo "Push failed (attempt $i), retrying..."
                      sleep $((RANDOM % 5 + 3))
                    done
                    echo "Changes committed and pushed"
                  else
                    echo "No changes to commit"
                  fi
