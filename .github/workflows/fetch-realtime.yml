name: Fetch Taiwan Stock Realtime Data

on:
    push:
        branches:
            - main
    # 允許手動觸發
    workflow_dispatch:

jobs:
    fetch-realtime:
        runs-on: ubuntu-latest

        # 設定權限以允許推送
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Set timezone
              run: |
                  echo "TZ=Asia/Taipei" >> $GITHUB_ENV

            - name: Check if market is open
              id: market-check
              run: |
                  # 取得台灣時間
                  TW_TIME=$(TZ=Asia/Taipei date +"%H%M")
                  TW_DAY=$(TZ=Asia/Taipei date +"%u")  # 1=Monday, 7=Sunday

                  echo "Current Taiwan time: $TW_TIME"
                  echo "Current Taiwan day: $TW_DAY"

                  # 檢查是否為週一到週五
                  if [ "$TW_DAY" -gt 5 ]; then
                    echo "Weekend - market is closed"
                    echo "should_run=false" >> $GITHUB_OUTPUT
                    exit 0
                  fi

                  # 檢查時間是否在 09:00 - 13:50 之間
                  if [ "$TW_TIME" -ge 0900 ] && [ "$TW_TIME" -le 1350 ]; then
                    echo "Market is open"
                    echo "should_run=true" >> $GITHUB_OUTPUT
                  else
                    echo "Market is closed"
                    echo "should_run=false" >> $GITHUB_OUTPUT
                  fi

            - name: Fetch realtime stock data
              if: steps.market-check.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
              run: node scripts/fetch-realtime.js

            # 指數與 CNN 各自獨立，失敗不阻擋個股資料的 commit（錯誤仍會顯示在該步驟）
            - name: Fetch TAIEX realtime
              if: steps.market-check.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
              continue-on-error: true
              run: node scripts/fetch-tw-index-realtime.js

            - name: Fetch CNN Fear & Greed realtime
              if: steps.market-check.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
              continue-on-error: true
              run: node scripts/fetch-cnn-realtime.js

            - name: Commit and push changes
              if: steps.market-check.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  # 檢查是否有變更
                  if [ -n "$(git status --porcelain)" ]; then
                    git add public/data/
                    TW_TIME=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
                    git commit -m "📈 Update realtime stock data - $TW_TIME"
                    # 推之前 rebase 避免兩個 job 同時推的衝突（與 US workflow 相同策略）
                    for i in 1 2 3 4 5; do
                      git pull --rebase -X theirs origin main || true
                      if git push; then
                        echo "Push succeeded on attempt $i"
                        break
                      fi
                      echo "Push failed (attempt $i), retrying..."
                      sleep $((RANDOM % 5 + 3))
                    done
                    echo "Changes committed and pushed"
                  else
                    echo "No changes to commit"
                  fi
