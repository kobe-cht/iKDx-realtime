name: Fetch World Market Data

# 觸發來源：cloudflare-cron-worker 以 workflow_dispatch 呼叫（平日每 10 分鐘、週末每小時）
# 抓 Mapverse 地圖世界需要的資料，輸出到 public/data/world/：
#   quotes.json   各國指數、商品、匯率、加密貨幣、公債殖利率（world_markets.json 列出的代碼）
#   tw-top.json   台股市值排行（證交所 OpenAPI）
#   top10.json    其它十個國家 / 地區（中日韓印英德法美加港）的市值前十大公司（Yahoo quote，候選名單見 world_top.json）
#   econ.json     各國經濟數據（world_econ.json 列出的指標；一個月才更新一次，所以每 3 小時才真的去抓）
on:
    workflow_dispatch:
        inputs:
            force_econ:
                description: '強制重抓經濟數據（忽略 3 小時的間隔限制）'
                required: false
                type: boolean
                default: false

# 同時只跑一個，避免兩次執行互相覆蓋 / 推送衝突
concurrency:
    group: fetch-world
    cancel-in-progress: false

jobs:
    fetch-world:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # 四個步驟各自獨立，失敗不阻擋其它步驟與 commit；最後一步再統一回報失敗
            - name: Fetch world quotes
              id: quotes
              continue-on-error: true
              run: node scripts/fetch-world-quotes.js

            - name: Fetch Taiwan market cap ranking
              id: twtop
              continue-on-error: true
              run: node scripts/fetch-tw-top.js

            - name: Fetch top 10 companies by market cap (other countries)
              id: worldtop
              continue-on-error: true
              run: node scripts/fetch-world-top.js

            - name: Fetch world economic data
              id: econ
              continue-on-error: true
              run: node scripts/fetch-world-econ.js
              env:
                  FORCE: ${{ inputs.force_econ == true && '1' || '' }}

            - name: Commit and push changes
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"

                  if [ -n "$(git status --porcelain public/data/world)" ]; then
                    git add public/data/world/
                    TW_TIME=$(TZ=Asia/Taipei date +"%Y-%m-%d %H:%M:%S")
                    git commit -m "🌏 Update world market data - $TW_TIME"
                    # 推之前 rebase 避免與台股 / 美股 workflow 同時推送的衝突
                    for i in 1 2 3 4 5; do
                      git pull --rebase -X ours origin main || true
                      if git push; then
                        echo "Push succeeded on attempt $i"
                        break
                      fi
                      echo "Push failed (attempt $i), retrying..."
                      sleep $((RANDOM % 5 + 3))
                    done
                  else
                    echo "No changes to commit"
                  fi

            - name: Report failures
              if: steps.quotes.outcome == 'failure' || steps.twtop.outcome == 'failure' || steps.worldtop.outcome == 'failure' || steps.econ.outcome == 'failure'
              run: |
                  echo "world quotes: ${{ steps.quotes.outcome }}, tw top: ${{ steps.twtop.outcome }}, world top: ${{ steps.worldtop.outcome }}, econ: ${{ steps.econ.outcome }}"
                  exit 1
